name: ICEGATE original PDF to Drive

on:
  schedule:
    # Daily at 9:00 AM IST
    - cron: '30 3 * * *'
    # Daily at 11:11 PM IST
    - cron: '50 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icegate-drive
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      DOWNLOAD_TOKEN: ${{ secrets.DOWNLOAD_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for a new notification
        id: notification
        run: node download.mjs --check-only

      - name: Install download software
        if: steps.notification.outputs.needed == 'true'
        run: npm ci --omit=dev

      - name: Install Chromium
        if: steps.notification.outputs.needed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Download original PDF and update Drive
        if: steps.notification.outputs.needed == 'true'
        run: node download.mjs
