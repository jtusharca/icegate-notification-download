name: ICEGATE original PDF to Drive

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST
    # 15:30 UTC = 09:00 PM IST
    - cron: '30 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icegate-drive
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --omit=dev

      - run: npx playwright install --with-deps chromium

      - run: node download.mjs
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          DOWNLOAD_TOKEN: ${{ secrets.DOWNLOAD_TOKEN }}
